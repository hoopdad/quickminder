name: Windows installer

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part release version (without v)
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Check release source
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Releases must be built from reviewed main source.'
          }
      - name: Build and verify packages
        shell: pwsh
        run: |
          .\scripts\Build-Release.ps1 -Version $env:RELEASE_VERSION
          $record = Get-Content "artifacts\release\$env:RELEASE_VERSION\release-record.json" -Raw | ConvertFrom-Json
          if ($record.sourceDirty -or $record.sourceCommit -ne $env:GITHUB_SHA) {
            throw 'Build did not use the exact clean checked-out source.'
          }
          if ($record.iceValidation -ne 'WiX ICE validation completed.') {
            throw $record.iceValidation
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            artifacts/release/*/*.msi
            artifacts/release/*/*-portable.zip
            artifacts/release/*/SHA256SUMS.txt
            artifacts/release/*/release-record.json
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs
          path: artifacts/release/*/*.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish exact verified assets
        shell: pwsh
        run: |
          $directory = Join-Path $PWD "release-assets\$env:RELEASE_VERSION"
          $record = Get-Content (Join-Path $directory 'release-record.json') -Raw | ConvertFrom-Json
          if ($record.sourceDirty -or $record.sourceCommit -ne $env:GITHUB_SHA -or $record.sourceBranch -ne 'main') {
            throw 'Release record does not match clean main source.'
          }
          foreach ($line in Get-Content (Join-Path $directory 'SHA256SUMS.txt')) {
            $hash, $name = $line -split '  ', 2
            if ($name -notmatch '^[A-Za-z0-9._-]+$' -or
                (Get-FileHash (Join-Path $directory $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw "Artifact integrity check failed: $name"
            }
          }
          $notes = @"
          Native Windows x64 tray notes, with an isolated fictional-data demo and current README screenshots.

          Download the MSI for a per-user install (no administrator access or separate .NET install required).
          Exit Quickminder before installing or upgrading, then launch it from Start.
          The portable ZIP is an alternative. Uninstall leaves notes and preferences intact.

          Packages are unsigned; Windows or organizational policies may block them.
          SHA256SUMS.txt and release-record.json record artifact integrity, source and verification.
          Source commit: $env:GITHUB_SHA
          "@
          $assets = @(
            (Join-Path $directory "Quickminder-$env:RELEASE_VERSION-win-x64.msi"),
            (Join-Path $directory "Quickminder-$env:RELEASE_VERSION-win-x64-portable.zip"),
            (Join-Path $directory 'SHA256SUMS.txt'),
            (Join-Path $directory 'release-record.json')
          )
          gh release create "v$env:RELEASE_VERSION" @assets --target $env:GITHUB_SHA --title "Quickminder $env:RELEASE_VERSION" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
